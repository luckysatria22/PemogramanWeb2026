<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Login Petugas</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="buku/list.html">Daftar Buku</a></li>
                <li><a href="anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Login Petugas</h2>

            <!--
                Catatan: form ini masih statis (belum diproses),
                sama seperti form Tambah Buku di jobsheet-01.
                Logika login sungguhan baru akan dibangun
                mulai jobsheet dengan JavaScript & PHP/PostgreSQL.
            -->
            <form action="#" method="post">
                <p>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username">
                </p>
                <p>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password">
                </p>
                <button type="submit">Masuk</button>
            </form>

            <p style="margin-top: 1rem;">
                Belum punya akun? <a href="registrasi.html">Daftar di sini</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>
</body>
</html>
